name: Validate harness
on:
  push:
    branches: ["main", "agent-harness"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py kaggle_gateway.py
      - run: python -m pip install -r requirements.txt
      - run: docker build -t jolgue-harness .
